<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Roamer 3D - Local Multiplayer</title>
  <!-- Google Fonts: Outfit for titles/UI, Space Mono for status logs -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <!-- Socket.io client script served by the Socket.io server -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Importmap for Three.js ES Modules from CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.147.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.147.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- 3D Canvas Container -->
  <div id="canvas-container"></div>
  
  <!-- Dynamic Name Tags and Speech Bubbles Container (HTML overlay over 3D canvas) -->
  <div id="label-container"></div>

  <!-- LOBBY OVERLAY -->
  <div id="lobby-overlay" class="overlay">
    <div class="lobby-card glass">
      <div class="lobby-header">
        <div class="logo-icon">▲</div>
        <h1>NEON ROAMER 3D</h1>
        <p>Local Multiplayer Interactive Arena</p>
      </div>
      
      <div class="form-group">
        <label for="username-input">CHOOSE NICKNAME</label>
        <input type="text" id="username-input" maxlength="15" placeholder="Enter name..." autocomplete="off">
      </div>

      <div class="form-group">
        <label>SELECT NEON ENERGY COLOR</label>
        <div class="color-grid" id="color-grid">
          <button class="color-option active" style="--color: #ff0055" data-color="#ff0055"></button>
          <button class="color-option" style="--color: #00ffcc" data-color="#00ffcc"></button>
          <button class="color-option" style="--color: #0077ff" data-color="#0077ff"></button>
          <button class="color-option" style="--color: #9900ff" data-color="#9900ff"></button>
          <button class="color-option" style="--color: #ffdd00" data-color="#ffdd00"></button>
          <button class="color-option" style="--color: #ff6600" data-color="#ff6600"></button>
          <button class="color-option" style="--color: #00ff33" data-color="#00ff33"></button>
          <button class="color-option" style="--color: #ff00ff" data-color="#ff00ff"></button>
        </div>
      </div>

      <button id="join-btn" class="glow-button">ENTER ARENA</button>
      
      <div class="lobby-footer">
        <p>Running locally. Open another tab or browser window to play together!</p>
      </div>
    </div>
  </div>

  <!-- IN-GAME HUD -->
  <div id="hud" class="hidden">
    <!-- Top Bar -->
    <div class="top-bar glass">
      <div class="status-indicator">
        <span class="pulse-dot"></span>
        <span id="connection-status">CONNECTED</span>
      </div>
      <div class="player-count-badge">
        ONLINE: <span id="online-count">1</span>
      </div>
    </div>

    <!-- Instructions / Controls Hint (Bottom Right) -->
    <div class="controls-hint glass">
      <h3>CONTROLS</h3>
      <ul>
        <li><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> / <span class="key">▲</span><span class="key">◀</span><span class="key">▼</span><span class="key">▶</span> : Move</li>
        <li><span class="key">SPACE</span> : Jump</li>
        <li><span class="key">ENTER</span> : Chat</li>
      </ul>
    </div>

    <!-- Chat Box (Bottom Left) -->
    <div class="chat-container glass">
      <div class="chat-log" id="chat-log">
        <div class="chat-message system">Welcome to Neon Roamer! Press ENTER to chat.</div>
      </div>
      <div class="chat-input-wrapper">
        <input type="text" id="chat-input" placeholder="Type message..." maxlength="80" autocomplete="off">
        <button id="send-chat-btn">SEND</button>
      </div>
    </div>

    <!-- Emotes Panel (Bottom Middle) -->
    <div class="emotes-panel glass">
      <button class="emote-btn" data-emote="jump" title="Bounce high!">🦘 JUMP</button>
      <button class="emote-btn" data-emote="wave" title="Do a barrel roll!">🌀 SPIN</button>
      <button class="emote-btn" data-emote="sparkle" title="Emit magic sparks!">✨ SHINE</button>
      <button class="emote-btn" data-emote="wave_hand" title="Friendly wave!">👋 WAVE</button>
    </div>
  </div>

  <!-- Load client modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
